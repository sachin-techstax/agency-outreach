services:
  nuntago-cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: nuntago-cli:${DEPLOY_SHA:-local}
    env_file:
      - .env
    environment:
      DB_PATH: /data/nuntago.db
      GMAIL_CLIENT_SECRET: /secrets/client_secret.json
      GMAIL_TOKEN_FILE: /secrets/token.json
      NUNTAGO_DEMO_MODE: ${NUNTAGO_DEMO_MODE:-false}
    volumes:
      - ./data:/data
      - ./secrets:/secrets
    working_dir: /workspace
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    network_mode: host
    stdin_open: true
    tty: true
    command: ["--help"]

  nuntago-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: nuntago-web:${DEPLOY_SHA:-local}
    env_file:
      - .env
    environment:
      DB_PATH: /data/nuntago.db
      GMAIL_CLIENT_SECRET: /secrets/client_secret.json
      GMAIL_TOKEN_FILE: /secrets/token.json
      NUNTAGO_DEMO_MODE: ${NUNTAGO_DEMO_MODE:-false}
    volumes:
      - ./data:/data
      - ./secrets:/secrets
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
