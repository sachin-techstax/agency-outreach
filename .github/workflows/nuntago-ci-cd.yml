name: Nuntago CI/CD

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: nuntago-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Prepare local runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .env.example .env
          mkdir -p data secrets
          export LOCAL_UID="$(id -u)"
          export LOCAL_GID="$(id -g)"
          echo "LOCAL_UID=$LOCAL_UID" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$LOCAL_GID" >> "$GITHUB_ENV"

      - name: Validate deployment scripts and Compose
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n infra/deploy-release.sh
          bash -n infra/bootstrap-hetzner.sh
          bash -n infra/migrate-production-identity.sh
          docker compose config >/dev/null

      - name: Build CLI and web images
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose build nuntago-cli nuntago-web

      - name: Run full Python suite
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose run --rm --entrypoint pytest nuntago-cli -q

      - name: Smoke-test Nuntago demo runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export NUNTAGO_DEMO_MODE=true
          docker compose up -d nuntago-web

          cleanup() {
            docker compose down --remove-orphans || true
          }
          trap cleanup EXIT

          body=""
          for attempt in $(seq 1 30); do
            if body="$(curl -fsS http://127.0.0.1:8080/api/health 2>/dev/null)"; then
              break
            fi
            sleep 2
          done

          echo "$body"
          echo "$body" | grep -Eq '"product"[[:space:]]*:[[:space:]]*"Nuntago"'
          echo "$body" | grep -Eq '"demo_mode"[[:space:]]*:[[:space:]]*true'

          status="$(curl -sS -o /tmp/demo-block.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/api/leads/1/approve)"
          cat /tmp/demo-block.json
          test "$status" = "403"

  deploy:
    name: Deploy to Hetzner
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_USER: ${{ secrets.HETZNER_USER }}
      HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
      HETZNER_SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in HETZNER_HOST HETZNER_USER HETZNER_SSH_PRIVATE_KEY HETZNER_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub Actions secret $name is missing"
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Package exact release
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/nuntago-${GITHUB_SHA}.tar.gz"
          tar \
            --exclude='./.git' \
            --exclude='./.env' \
            --exclude='./data' \
            --exclude='./secrets' \
            --exclude='./.venv' \
            --exclude='./frontend/node_modules' \
            --exclude='./frontend/dist' \
            --exclude='./*.db' \
            -czf "$archive" .
          echo "RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload release archive
        shell: bash
        run: |
          set -Eeuo pipefail
          port="${HETZNER_SSH_PORT:-22}"
          remote="/tmp/nuntago-${GITHUB_SHA}.tar.gz"
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -P "$port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$RELEASE_ARCHIVE" \
            "$HETZNER_USER@$HETZNER_HOST:$remote"

      - name: Activate exact release
        shell: bash
        run: |
          set -Eeuo pipefail
          port="${HETZNER_SSH_PORT:-22}"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$HETZNER_USER@$HETZNER_HOST" \
            "APP_ROOT='/srv/nuntago' RELEASE_SHA='${GITHUB_SHA}' ARCHIVE='/tmp/nuntago-${GITHUB_SHA}.tar.gz' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          : "${APP_ROOT:?APP_ROOT is required}"
          : "${RELEASE_SHA:?RELEASE_SHA is required}"
          : "${ARCHIVE:?ARCHIVE is required}"

          shared="$APP_ROOT/shared"
          test -f "$shared/.env" || {
            echo "Missing $shared/.env. Run the Nuntago identity migration/bootstrap before merging this release." >&2
            exit 1
          }

          releases="$APP_ROOT/releases"
          release="$releases/$RELEASE_SHA"
          mkdir -p "$releases" "$shared/data" "$shared/secrets"
          rm -rf "$release"
          mkdir -p "$release"

          tar -xzf "$ARCHIVE" -C "$release"
          rm -f "$ARCHIVE"

          ln -sfn "$shared/.env" "$release/.env"
          ln -sfn "$shared/data" "$release/data"
          ln -sfn "$shared/secrets" "$release/secrets"

          chmod +x "$release/infra/deploy-release.sh"
          APP_ROOT="$APP_ROOT" RELEASE_SHA="$RELEASE_SHA" "$release/infra/deploy-release.sh"
          REMOTE
